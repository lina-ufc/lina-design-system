<h2>LINA sobre a sua grade</h2>
<div id="logotipo-com-a-grade-d" style="margin-top:18px"></div>
<p class="cap" style="margin-top:12px">Linhas finas: quartos de célula. Linhas médias: meias células. Tracejado claro: os blocos. Eixos em células.</p>
<script src="assets/lina-geometry.js"></script><script src="assets/lina-draw.js"></script><script>{

}</script>
