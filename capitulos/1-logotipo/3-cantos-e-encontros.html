<h2>Cinco situações, um só raio</h2>
<p class="p">O contorno é traçado uma vez sobre a união. O tracejado mostra a união antes do arredondamento.</p>
<div id="cantos-e-encontros-d" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;align-items:start;margin-top:16px"></div>
<script src="assets/lina-geometry.js"></script><script src="assets/lina-draw.js"></script><script>{
const {G,shape,grid,path,outline,hdim,svg}=LD,s=22;
const F=[{b:[[0,0,2]],w:2,h:2,t:'<b>Canto livre</b> — arco convexo de ¼ de célula.'},
{b:[[0,0,2],[0,2,2],[2,2,2]],w:4,h:4,t:'<b>Encontro</b> — o canto interno arredonda para dentro, com o mesmo raio.'},
{b:[[0,0,2],[2,2,2]],w:4,h:4,t:'<b>Contato pelo canto</b> — conta como ligação e forma o pescoço.'},
{b:[[0,0,2],[2,0,2],[3,0,2],[0,2,2],[3,2,2]],w:5,h:4,gap:1,t:'<b>Vão interno</b> — no mínimo ½ célula; daí o arco semicircular.'},
{b:[[0,0,2],[0,2,2]],b2:[[0,0,2],[0,2,2]],dx:2.5,w:4.5,h:4,t:'<b>Formas distintas</b> — podem ficar a ¼ de célula.'}];
const el=document.getElementById('cantos-e-encontros-d');
F.forEach(f=>{const m=s,ox=m,oy=m*1.2,W=f.w*s+2*m,H=f.h*s+m*2.2;let o=grid(ox-s/2,oy-s/2,f.w*s+s,f.h*s+s,s/2,G.faint);
o+=path(shape(f.b,s,ox,oy),G.dark)+outline(shape(f.b,s,ox,oy,0),G.mid);
if(f.b2){o+=path(shape(f.b2,s,ox+f.dx*s,oy),G.dark)+outline(shape(f.b2,s,ox+f.dx*s,oy,0),G.mid)+hdim(ox+2*s,ox+2.5*s,oy-10,'¼');}
if(f.gap)o+=hdim(ox+2*s,ox+3*s,oy+f.h*s+12,'½',G.dark,true);
const d=document.createElement('div');d.className='fig';d.innerHTML='<div style="height:'+(4*s+s*2.2)+'px;display:flex;align-items:flex-end">'+svg(W,H,o)+'</div>'+'<p class="cap">'+f.t+'</p>';el.appendChild(d);});
}</script>
