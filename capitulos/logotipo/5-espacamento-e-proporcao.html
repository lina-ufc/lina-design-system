<h2>Espaçamento e proporção</h2>
<p class="regra">As letras são formas distintas, então ficam a ¼ de célula, a única medida fora da <a href="logotipo.html#s-logotipo-com-a-grade">grade de meia célula</a>.</p>
<div id="espacamento-e-proporcao-d" class="prancha rola" tabindex="0" role="region" aria-label="Espaçamento e proporção do logotipo: letras a ¼ de célula, 8¾ por 3 células"></div>
<script src="assets/lina-geometry.js"></script><script src="assets/lina-draw.js"></script><script>{
const {G,lx,wordmark,hdim,vdim,path,svg,mount}=LD,s=34,W=17.5*s,H=6*s,ox=46,oy=34;let o='';
[['I',4],['n',6.5],['A',12]].forEach(([k,x])=>{o+='<rect x="'+(ox+x*s)+'" y="'+(oy-4)+'" width="'+(s/2)+'" height="'+(H+8)+'" fill="'+G.faint+'"/>'+hdim(ox+x*s,ox+x*s+s/2,oy-12,'¼');});
o+='<line x1="'+(ox+lx('n')*s-6)+'" y1="'+(oy+s)+'" x2="'+(ox+W+6)+'" y2="'+(oy+s)+'" stroke="'+G.mid+'" stroke-dasharray="4 3"/>';
o+=path(wordmark(s,ox,oy),G.dark);
o+=vdim(ox+W+18,oy,oy+s,'½')+vdim(ox-16,oy,oy+H,'3',G.dark,true)+hdim(ox,ox+W,oy+H+22,'8¾ células',G.dark,true);
mount('espacamento-e-proporcao-d',svg(W+ox+60,H+oy+52,o));
}</script>
<h3>Medidas</h3>
<ul class="regras"><li>O n começa meia célula abaixo das outras: é a altura de x da palavra.</li><li>O conjunto mede 8¾ × 3 células.</li></ul>
