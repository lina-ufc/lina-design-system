<h2>Variações</h2>
<p class="regra">O horizontal é o logotipo principal.</p>
<p class="p">O vertical (LI sobre nA, a ¼ de célula) serve a colunas estreitas. O símbolo, o L sozinho, entra onde não há espaço para a palavra. Sempre em uma tinta só; as cores possíveis estão em <a href="logotipo.html#s-combinacoes-de-cores">1.8</a>.</p>
<div id="variacoes-d" class="prancha"></div>
<script src="assets/lina-geometry.js"></script><script src="assets/lina-draw.js"></script><script>{
const {wordmark,vertical,letter}=LD;
const R=[['Horizontal',wordmark(1),'0 0 17.5 6'],['Vertical',vertical(1),'0 0 10.5 12.5'],['Símbolo',letter('L',1),'0 0 4 6']];
document.getElementById('variacoes-d').innerHTML=R.map(r=>'<div class="fig"><svg viewBox="'+r[2]+'"><path d="'+r[1]+'" fill="var(--ferro)" fill-rule="evenodd"/></svg><p class="cap"><b>'+r[0]+'</b></p></div>').join('');
}</script>
